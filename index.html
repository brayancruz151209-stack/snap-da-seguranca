<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Snap da Segurança — jogo de cartas educativo sobre segurança do trabalho.">
<title>Snap da Segurança — Trabalho Seguro Ltda.</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --segura:#22c55e; --perigo:#ef4444; --gold:#fbbf24; }
  body { font-family:'Segoe UI',system-ui,Arial,sans-serif; background:radial-gradient(ellipse at 50% 0%,#172b34 0%,#0b1220 52%,#050a12 100%); min-height:100vh; color:#e2e8f0; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:min(700px,100%); background:rgba(15,23,42,.96); border:1px solid #334155; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,.55); padding:40px 24px; text-align:center; }
  h1 { font-size:clamp(28px,8vw,52px); color:#fbbf24; margin-bottom:14px; }
  p { color:#cbd5e1; line-height:1.6; max-width:560px; margin:0 auto 22px; }
  .btn { display:inline-block; background:linear-gradient(180deg,#fde047,#f59e0b); color:#0f172a; border:0; border-radius:12px; padding:14px 24px; font-weight:900; text-decoration:none; }
  .icons { font-size:46px; margin:20px 0; }
</style>
</head>
<body>
<main class="card">
  <div class="icons">⛑️ 🛡️ 🎴</div>
  <h1>SNAP DA SEGURANÇA</h1>
  <p>Trabalho Seguro Ltda. — UC07</p>
  <p>O site está publicado no GitHub Pages. Coloque aqui o conteúdo completo do seu jogo para começar a jogar.</p>
  <a class="btn" href="https://github.com/brayancruz151209-stack/snap-da-seguranca">VER REPOSITÓRIO</a>
</main>
</body>
</html>
